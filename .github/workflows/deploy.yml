name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Set up sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy to Server
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p 65002 u202480925@157.173.216.100 << 'EOF'
          cd /home/u202480925/domains/bluedive.in/public_html
          find . -type f ! -name '.htaccess' -delete
          rm -rf ./*
          cp -r ~/github/workspace/dist/* ./
          EOF
