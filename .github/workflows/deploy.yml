name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no -p 65002 u202480925@157.173.216.100 << 'EOF'
          cd /home/u202480925/domains/bluedive.in/public_html
          find . -type f ! -name '.htaccess' -delete
          rm -rf ./*
          cp -r ~/github/workspace/dist/* ./
          EOF
