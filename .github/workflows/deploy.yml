name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Create .env file
        run: echo "VITE_BASE_URL = https://api.bluedive.in/" > .env

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Set up sshpass
        run: sudo apt-get install -y sshpass

      - name: Clean up old files
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p 65002 u202480925@157.173.216.100 << 'EOF'
          cd /home/u202480925/domains/bluedive.in/public_html
          find . -type f ! -name '.htaccess' -delete
          rm -rf ./*

          EOF

      - name: Upload new files
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -P 65002 -r dist/* u202480925@157.173.216.100:/home/u202480925/domains/bluedive.in/public_html/
            
